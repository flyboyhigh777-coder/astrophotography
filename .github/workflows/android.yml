name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AstroStacker-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Настоящее приложение (Activity + Compose) под Robolectric: проходит
      # все экраны и снимает скриншоты в app/build/outputs/roborazzi.
      - name: App UI flow test
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Стабильная, не истекающая ссылка на скачивание вместо GitHub Actions
      # Artifacts: у артефактов подписанный Azure Blob URL с коротким сроком
      # жизни и капризным для мобильных браузеров скачиванием (обрывается на
      # середине). Публикуем APK как asset у GitHub Release с фиксированным
      # тегом debug-latest - обычная прямая ссылка github.com/.../releases/
      # download/..., перезаписывается при каждой сборке в main.
      - name: Publish debug APK to a stable GitHub Release
        if: github.event_name != 'pull_request'
        working-directory: android-project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "AstroStacker - debug APK (последняя сборка)" \
            --notes "Автосборка с main, коммит ${GITHUB_SHA}. Ссылка на этот релиз не меняется - обновляется при каждом пуше." \
            --target "${GITHUB_SHA}"

      - name: Publish screenshots to ci-screenshots branch
        if: always() && github.event_name != 'pull_request'
        working-directory: android-project/app/build
        run: |
          [ -d outputs/roborazzi ] || { echo "no screenshots"; exit 0; }
          mkdir -p publish && cp outputs/roborazzi/*.png publish/ 2>/dev/null || true
          [ -d reports/tests ] && cp -r reports/tests publish/test-report || true
          cd publish
          echo "Screenshots for ${GITHUB_SHA}" > README.md
          git init -q -b ci-screenshots
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            android-project/core/build/reports/tests/
            android-project/app/build/reports/tests/
          if-no-files-found: ignore
